  service:
    type: NodePort
    port: 34197

  factorioServer:
    generate_new_save: false
    enable_space_age: true

  account:
    accountSecret: 'account-secret'

  serverPassword:
    passwordSecret: 'game-secret'

  server_settings:
    name: 'As allways'
    require_user_verification: true
    autosave_interval: 5
    tags:
      - 'game'
      - 'factorio'
      - 'server'
      - 'modded'
      - 'as-always'
    visibility:
      public: true
      lan: false

  import_save:
    enabled: false

  rcon:
    external: false
    passwordSecret: 'rcon-secret'

  admin_list:
    - gamabe_cz
    - mugac

  persistence:
    enabled: true
    dataDir:
      Size: "5Gi"
