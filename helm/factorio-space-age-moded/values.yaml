    autosave_interval: 5
    tags:
      - 'game'
      - 'factorio'
      - 'server'
      - 'modded'
      - 'as-always'
    visibility:
      public: true
      lan: false

  import_save:
    enabled: false
    source_url: ''

  rcon:
    external: false
    passwordSecret: 'rcon-secret'

  admin_list:
    - gamabe_cz
    - mugac
