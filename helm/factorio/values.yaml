  service:
    type: ClusterIP
    port: 34197

  factorioServer:
    generate_new_save: false

  account:
    accountSecret: 'account-secret'

  serverPassword:
    passwordSecret: 'game-secret'

  server_settings:
    name: 'As allways'
    require_user_verification: true
    autosave_interval: 5
    tags:
      - 'game'
      - 'factorio'
      - 'server'
      - 'modded'
      - 'as-always'
    visibility:
      public: true
      lan: false

  import_save:
    enabled: false
    source_url: 'https://cdn.discordapp.com/attachments/936038038352592926/1191922726412226580/JakoVzdycky.zip?ex=65a7338a&is=6594be8a&hm=12884b3a018dc43989813abdb8de7d8671b80b3968405576a51148e26a123b21&' 

  rcon:
    external: false
    passwordSecret: 'rcon-secret'

  admin_list:
    - gamabe_cz
    - mugac
